[project]
name = "skyrim-alchemy-optimizer"
version = "2.0.0"
description = "Skyrim alchemy potion optimizer using inventory screenshots and linear programming"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "pillow",
    "requests",
    "pulp",
    "pytesseract",
    "python-multipart",
    "rapidfuzz",
    "sse-plugin-interface>=1.0.1",
    "sse-bsa>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright]
include = ["app", "cli.py"]
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.14"
