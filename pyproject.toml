[project]
name = "skyrim-alchemy-optimizer"
version = "1.0.0"
description = "Skyrim alchemy potion optimizer using inventory screenshots and linear programming"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "pillow",
    "requests",
    "beautifulsoup4",
    "lxml",
    "pulp",
    "pytesseract",
    "rapidfuzz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright]
include = ["app", "run.py"]
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.14"
