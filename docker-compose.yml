services:
  app:
    build:
      context: .
      target: prod
    image: skyrim-alchemy-optimizer:latest
    ports:
      - "8001:8001"
    environment:
      - OCR_SERVICE_TOKEN=${OCR_SERVICE_TOKEN}
    volumes:
      - ./cache:/app/cache
      - ./logs:/app/logs
    networks:
      - alchemy-internal
      - default
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      ocr:
        condition: service_healthy

  ocr:
    build:
      context: ./ocr_service
      target: prod
    image: skyrim-ocr-service:latest
    environment:
      - OCR_SERVICE_TOKEN=${OCR_SERVICE_TOKEN}
    networks:
      - alchemy-internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

networks:
  alchemy-internal:
    internal: true
