[project]
name = "skyrim-ocr-service"
version = "1.0.0"
description = "Isolated Tesseract OCR microservice for the Skyrim Alchemy Optimizer"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pillow",
    "pytesseract",
    "python-multipart",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["main.py"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pyright]
include = ["main.py"]
stubPath = "typings"
typeCheckingMode = "strict"
pythonVersion = "3.14"
